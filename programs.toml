# =====================================================================
#  Programs tab: undergraduate programs that aren't a company job board
#
#  Each entry was read on the program's own page on the date in `verified`.
#  Only dates the official page states go in `deadlines` (with the page's own
#  words in `text`); nothing is filled in from memory or past years.
#  `estimate` is for past-cycle timing and always shows as an estimate.
#
#  Every scan re-reads `url` and flags the program when the page changes, so
#  you know to re-check it and update this file (then set `verified`).
#
#  status: "open"        the page says applications are open
#          "closed"      the page says this cycle is closed
#          "published"   the page gives deadlines but doesn't say open/closed
#          "not-yet"     the page says applications haven't opened
#          "unverified"  couldn't confirm; check the page
#  Individual internship postings still follow max_age_days (15) in
#  profile.toml; these records follow each program's application cycle.
# =====================================================================

[[program]]
name = "NASA OSTEM Internships"
sponsor = "NASA Office of STEM Engagement"
url = "https://www.nasa.gov/learning-resources/internship-programs/"
apply = "https://stemgateway.nasa.gov/public/s/explore-opportunities"
terms = ["Summer 2027", "Fall 2027"]
status = "published"
status_note = "The page lists deadlines but doesn't say whether applications are open. Projects are posted on NASA STEM Gateway on a rolling basis."
eligibility = "U.S. citizens; 18 or older by the session start; 3.0 GPA on a 4.0 scale; enrolled full- or part-time in an accredited degree or certificate program (recent graduates may apply for the four sessions after graduating). STEM and non-STEM majors."
verified = "2026-11-19"
page_updated = "2026-11-04"
deadlines = [
  { term = "Summer 2027", date = "2027-03-01", text = "Summer 2027 Application Deadline: March 1, 2027 (11:59 p.m. EST)" },
  { term = "Fall 2027", date = "2027-05-24", text = "Fall 2027 Application Deadline: May 24, 2027 (11:59 p.m. EST)" },
]

