# =====================================================================
#  Your matching profile
#  Built from your resume. There is NO contact info in here on purpose,
#  because this repo is public. Edit freely: the next run uses it.
# =====================================================================

[student]
name = "Jonas"
major = "Aerospace Engineering"
school = "University of Central Florida"
graduation_year = 2029
# Optional. Leave at 0.0 to skip GPA checks (the repo is public).
gpa = 0.0
# Most aerospace/defense internships require U.S. citizenship (ITAR) or a
# clearance. Set this to true or false so those requirements get checked;
# leave it commented out and they show as "confirm".
us_citizen = true

# The job page has four tabs:
#   New this week    everything below that was posted in the last 7 days
#   Summer 2027      aerospace (and mechanical) internships      -> [search]
#   Fall 2027        any engineering, near home                  -> [fall]
#   All engineering  any engineering major, mechanical first     -> [broad]

[search]
# The Summer 2027 aerospace section. Postings that clearly name a different
# season (Fall 2026, Spring 2027, Summer 2026...) are dropped.
season = "summer"
year = 2027
# Many postings never say which season. Keep those? (true = keep)
include_unstated_season = true
# Anything scoring below this is hidden from the page.
min_score = 40
# Drop postings older than this many days (when the date is known). Applies to every section.
max_age_days = 15
# Drop postings outside the U.S. (ones with an unclear location are kept). Applies to every section.
us_only = true
# Only show companies listed under [aerospace_companies] in sources.toml
# (plus every company whose career board is scanned, and federal jobs).
# Keeps the big internship lists from adding chip makers, carmakers, etc.
# Summer section only: the All engineering and Fall sections take any company.
aerospace_companies_only = true

[fall]
# Fall 2027 internships and co-ops within a radius of home, any engineering
# discipline (mechanical and aerospace score highest). Fall co-ops are mostly
# posted January to April, so expect this tab to be short until then.
enabled = true
season = "fall"
year = 2027
home_name = "UCF"
home_lat = 28.6024
home_lon = -81.2001
# Straight-line miles. 55 reaches Melbourne (51 mi: L3Harris, Northrop, Collins,
# Embraer) and Palm Bay (54 mi); Titusville/KSC 24-34, Cape Canaveral 39, Daytona 43.
radius_miles = 55
# Remote postings can be done from anywhere, so they're included and tagged "Remote".
include_remote = true
min_score = 30

[broad]
# All engineering: Summer 2027 internships for any engineering major from any
# company, scored against your resume, so mechanical work rises to the top.
season = "summer"
year = 2027
include_unstated_season = true
min_score = 30

[page]
# Postings older than this get an "Older than 15 days" tag (and can be hidden).
old_after_days = 15

[ai]
# Optional: a short written fit review by Claude for top matches.
# Only runs if you add an ANTHROPIC_API_KEY secret (see README).
enabled = true
model = "claude-haiku-5-5"
max_reviews_per_run = 20
min_score_to_review = 55

# ---------------------------------------------------------------------
#  What makes a posting "aerospace engineering"
#  A trailing * means "starts with" (rocket* matches rockets, rocketry).
# ---------------------------------------------------------------------
[relevance]
title_strong = [
  "aerospace", "aeronautic*", "astronautic*", "propulsion", "aerodynamic*",
  "aero", "aerostructure*", "structures", "structural", "stress", "flight",
  "rocket*", "spacecraft", "launch", "airframe", "gnc", "guidance",
  "satellite*", "space vehicle*", "engine", "engines", "turbine*", "thermal",
  "fluids", "fluid", "cfd", "wind tunnel", "aircraft", "rotorcraft", "uas",
  "missile*", "hypersonic*", "combustion", "orbital",
]
title_medium = [
  "mechanical", "materials", "material", "composite*", "manufacturing",
  "test", "testing", "integration", "payload*", "vehicle*", "hardware",
  "design", "propellant*", "avionics", "mechanism*", "dynamics", "controls",
  "additive", "metallurg*", "fabrication",
]
title_weak = [
  "engineer", "engineering", "systems", "quality", "reliability",
  "production", "r&d", "research",
]
# Words in the job description that signal aerospace work.
text_keywords = [
  "aerospace", "aerodynamic*", "propulsion", "spacecraft", "launch vehicle*",
  "rocket*", "aircraft", "airframe", "flight test*", "wind tunnel", "cfd",
  "computational fluid", "composite*", "structural analysis", "stress analysis",
  "thermal analysis", "turbine*", "satellite*", "orbit*", "avionics", "gnc",
  "hypersonic*", "combustion", "materials", "fea", "finite element",
]
# Bonus points when the posting lists these majors.
[relevance.majors]
"aerospace engineering" = 10
"aeronautical engineering" = 10
"astronautical engineering" = 10
"mechanical engineering" = 6
"materials science" = 4
"materials engineering" = 4

# Titles containing any of these are dropped, unless the title also
# contains a strong aerospace word (so "GNC Software Intern" survives).
[relevance.exclude]
title = [
  "software", "data scien*", "data analy*", "machine learning", "ai engineer",
  "finance", "financial", "accounting", "marketing", "sales", "legal",
  "counsel", "human resources", "hr", "recruit*", "talent", "communications",
  "business", "supply chain", "procurement", "buyer", "cyber*",
  "information security", "it support", "network", "product manag*",
  "quant*", "trading", "investment", "ux", "graphic design", "web", "frontend",
  "backend", "full stack", "devops", "security analyst", "paralegal",
  "facilities", "environmental health", "ehs", "audit", "tax", "payroll",
  # Computing roles (they'd otherwise slip into All engineering as "engineering")
  "cloud", "developer", "database", "data engineer*", "analytics", "artificial intelligence", "ai/ml",
  "information technology", "it intern", "computer science", "site reliability", "devsecops",
  "mobile", "android", "ios", "game", "solutions architect", "prompt", "desktop", "help desk",
  "administrator",
]
# Titles containing these are always dropped (roles for grad students).
title_always = ["phd", "ph.d", "master's", "masters", "mba", "graduate intern", "graduate student", "doctoral"]

# ---------------------------------------------------------------------
#  The All engineering and Fall sections: any engineering discipline.
#  Each title gets the first discipline below that matches, and its points
#  (out of 40, plus description keywords and majors) put mechanical and
#  aerospace work first. The All engineering tab can filter by discipline.
# ---------------------------------------------------------------------
[engineering]
# A title with only these words counts as "General engineering" (8 points)
title_generic = ["engineer*", "engineering", "technical intern", "r&d"]
# Description words that mean hands-on mechanical work (2 points each, up to 10)
text_keywords = [
  "solidworks", "cad", "gd&t", "fea", "finite element", "thermodynamic*", "heat transfer",
  "fluid mechanics", "fluid dynamics", "mechanical design", "prototyp*", "machining", "cnc",
  "3d print*", "additive manufacturing", "tolerance*", "dfm", "design for manufactur*",
  "creo", "catia", "ansys", "composite*", "test stand*", "fixture*", "mechanism*",
]

[engineering.majors]
"mechanical engineering" = 10
"aerospace engineering" = 10
"aeronautical engineering" = 10
"manufacturing engineering" = 6
"industrial engineering" = 4
"materials science" = 4
"engineering mechanics" = 6

