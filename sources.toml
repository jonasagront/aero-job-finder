# Career sites with a plain search page and no hiring-system API. search = the
# search page's address with {term} and either {page} (1, 2, 3...) or {offset}
# (how many results came before) in it; path = how links to single postings
# start. Each posting's page must carry standard job-posting data, or labeled
# fields as on Avature career sites (jobs.siemens-energy.com...).
searchpage = [
  { name = "Gulfstream", search = "https://careers.gulfstream.com/en/jobs/?search={term}&page={page}", path = "/en/jobs/" },
  # Siemens Energy's U.S. headquarters is in Orlando.
  { name = "Siemens Energy", search = "https://jobs.siemens-energy.com/en_US/jobs/Jobs?search={term}&folderOffset={offset}", path = "/en_US/jobs/FolderDetail/", aero = false },
]

