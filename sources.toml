# Not supported yet, so they rely on the lists below:
#   Kratos (only on the shared DirectEmployers feed, which gives no company names),
#   Redwire (Clinch: postings load in the browser), HEICO (ADP Recruiting, which
#   refuses scripts), Ducommun (Cornerstone), Elbit America (Dayforce),
#   General Dynamics Land Systems (blocks scripts), MDA (Canada only),
#   Relativity Space's student roles (RippleMatch; its Greenhouse board has none),
#   X-Bow Systems (ApplicantPro), Mercury Systems, Parker Aerospace, Embraer,
#   Astrobotic (Synchr), Southwest Research Institute (swri.jobs sends an incomplete
#   security certificate), Tesla (blocks scripts), and the Consider-run portfolio
#   boards (Airbus Ventures, Sequoia, Kleiner Perkins), which refuse scripts.
#   Intuitive Machines posts on the Space Capital board below.
#   intern-list.com covers several of these as leads.

