# --- Big names: when well-known employers usually recruit ------------------
# Shown in the "Big names" tab with what this cycle's scans have found from each.
#   match  = company-name pieces, as in [aerospace_companies] (= for the whole name)
#   window = [first month, last month] summer interns are usually recruited
#            (typical pattern from past cycles, an estimate; it can wrap the year)
#   dates  = a published date, when the program announces one
#   scanned = false when no source here reads that program (apply on its own site)
[[popular]]
name = "SpaceX"
match = ["spacex"]
careers = "https://www.spacex.com/careers/"
window = [8, 11]
note = "Summer roles go up in late summer and fill on a rolling basis, so apply in the first few weeks."

[[popular]]
name = "Blue Origin"
match = ["blue origin"]
careers = "https://www.blueorigin.com/careers"
window = [8, 11]
note = "Summer internships have opened around September 1 in recent years and close within weeks."

[[popular]]
name = "NASA internships (OSTEM)"
match = ["=nasa"]
careers = "https://www.nasa.gov/learning-resources/internship-programs/"
window = [11, 2]
dates = "Summer 2027 deadline around Feb 26 to Mar 1, 2027; Fall 2027 around May 21 to 24. U.S. citizens only."
scanned = false
note = "Apply on NASA STEM Gateway. Projects post on a rolling basis before the deadline."

[[popular]]
name = "NASA JPL"
match = ["jet propulsion"]
careers = "https://www.jpl.nasa.gov/edu/internships/"
window = [10, 3]

[[popular]]
name = "Lockheed Martin"
match = ["lockheed", "sikorsky"]
careers = "https://www.lockheedmartinjobs.com/college-students"
window = [8, 12]
note = "Hires thousands of interns across hundreds of sites; many keep posting into spring. Big Orlando presence."

[[popular]]
name = "Northrop Grumman"
match = ["northrop"]
careers = "https://www.northropgrumman.com/careers/students-and-early-careers"
window = [8, 12]
