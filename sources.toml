]

# Paycor Recruiting: client = the clientId in the company's
# recruitingbypaycor.com/career/CareerHome.action?clientId=... address.
paycor = [
  { name = "York Space Systems", client = "8a7883d0821e1a6301823c22a8bd068b" },
]

# Not supported yet, so they rely on the lists below:
#   Kratos (only on the shared DirectEmployers feed, which gives no company names),
#   Redwire (Clinch: postings load in the browser), HEICO (ADP Recruiting, which
#   refuses scripts), Ducommun (Cornerstone), Elbit America (Dayforce),
#   General Dynamics Land Systems (blocks scripts), MDA (Canada only).
#   Intuitive Machines posts on the Space Capital board below.
#   intern-list.com covers several of these as leads.

# --- Big student internship lists maintained on GitHub ----------------
# Simplify + Pitt CSC's Summer 2027 list (thousands of roles, updated daily).
# Includes off-season terms, which is where most Fall 2027 postings come from.
[[list]]
name = "Simplify Summer 2027 list"
urls = [
  "https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json",
  "https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/main/.github/scripts/listings.json",
]

# Removed Oct 2026: Jobright's engineering list (links to jobright.ai, an AI job
# site, not the company) and vanshb03's list (links through a redirect shortener).

# --- Job boards that collect postings from many companies ----------------
# Space Capital's board (formerly Space Talent): ~1,300 internships from
# hundreds of space and defense companies. collection = the number in the
# board's api.getro.com/api/v2/collections/<collection>/... requests.
[[getro]]
name = "Space Capital job board"
collection = 338

# intern-list.com: about 19,000 U.S. engineering internships in a public Airtable
# table on the site. Its Apply links go to jobright.ai, which hides the company's
# link behind a sign-in, so its postings show as leads with a "Find posting"
# button. A lead is kept only when the company is in [aerospace_companies] below
# (or has a board above) and no company board already has the same job.
# views = the app.../shr... part of the table's airtable.com/embed/ address on
# intern-list.com (the "Engineering and Development" table, United States).
[[internlist]]
name = "intern-list.com"
views = ["appmXHK6JoqQcSKf6/shruwVkAKPjHFdVJu"]

# --- Finding career sites automatically ---------------------------------
# When an aerospace company (see [aerospace_companies] below) has a posting on
# any list above, and its link goes to a hiring system the scan can read, that
# company's whole career site is scanned from then on. These lists are also
# searched for that, closed postings included, so companies that hired interns
# last year get checked before they post again. Found sites are saved in
# data/discovered_boards.json and shown as "found automatically" on the page.
[discover]
urls = [
  "https://raw.githubusercontent.com/SimplifyJobs/Summer2026-Internships/dev/.github/scripts/listings.json",
  "https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json",
]

# --- Federal jobs (DoD, Air Force, Navy, NASA) via USAJOBS --------------
# Free API key: https://developer.usajobs.gov/apirequest/
# Then add USAJOBS_API_KEY and USAJOBS_EMAIL as repo secrets (see README).
[usajobs]
keywords = ["aerospace engineering student", "engineering student trainee", "aerospace intern",
            "mechanical engineering student", "engineering technician student"]

# --- One employer, many names ---------------------------------------------
# Lists name divisions their own way ("Raytheon" or "Collins Aerospace" for a job
# on RTX's career site). Names on the right count as the employer on the left when
# checking whether a lead without a link is a job a career site already has.
# Matched as whole words; start a name with = to match the whole company name only.
[same_company]
rtx = ["rtx", "raytheon", "collins aerospace", "pratt & whitney", "pratt and whitney"]
textron = ["textron", "=bell", "bell textron", "bell flight", "kautex"]
lockheed = ["lockheed", "sikorsky"]

