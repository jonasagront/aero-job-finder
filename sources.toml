# =====================================================================
#  Where the job finder looks
#  Every source is optional. If one stops working, the run keeps going
#  and the bottom of your job page lists which sources failed.
# =====================================================================

# NOTE: plain `key = [...]` lines must stay ABOVE the first [table] or
# [[table]] header. TOML attaches anything below a header to that table,
# which silently hid every company board from the scan.

# --- Links never to show ------------------------------------------------
# Postings whose Apply link goes to one of these sites are skipped, so every
# Apply button opens the company's own posting. These are AI job sites,
# aggregators, and redirect shorteners that sit between you and the company.
blocked_link_domains = [
  "jobright.ai", "go.vansh.nyc", "simplify.jobs", "ziprecruiter.com", "lensa.com",
  "jooble.org", "talent.com", "adzuna.com", "jobgether.com", "jobleads.com",
  "learn4good.com", "careerbuilder.com", "monster.com", "snagajob.com",
]

