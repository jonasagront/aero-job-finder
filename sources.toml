# IBM Kenexa BrassRing: partner and sites = the partnerid and siteid values in
# the career site's sjobs.brassring.com/TGnewUI/Search/Home/Home?... address.
# location_fields / title_field = which of the site's fields hold the city and
# state, and the specific job name (default "jobtitle").
