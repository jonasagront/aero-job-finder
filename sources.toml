#   match  = company-name pieces, as in [aerospace_companies] (= for the whole name)
#   window = [first month, last month] summer interns are usually recruited
#            (typical pattern from past cycles, an estimate; it can wrap the year)
#   dates  = a published date, when the program announces one
#   scanned = false when no source here reads that program (apply on its own site)

