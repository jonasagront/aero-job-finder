# intern-list.com: about 19,000 U.S. engineering internships in a public Airtable
# table on the site. Its Apply links go to jobright.ai, which hides the company's
# link behind a sign-in, so its postings show as leads with a "Find posting"
# button. A lead is kept only when the company is in [aerospace_companies] below
# (or has a board above) and no company board already has the same job.
# views = the app.../shr... part of the table's airtable.com/embed/ address on
# intern-list.com (the "Engineering and Development" table, United States).
[[internlist]]
name = "intern-list.com"
views = ["appmXHK6JoqQcSKf6/shruwVkAKPjHFdVJu"]

# --- Finding career sites automatically ---------------------------------
# When an aerospace company (see [aerospace_companies] below) has a posting on
# any list above, or on one in data/history.json from the past 15 months (closed
# postings included), and its link goes to a hiring system the scan can read,
# that company's whole career site is scanned from then on, so companies that
# hired interns last cycle get checked before they post again. Other employers
# qualify with at least engineering_min aerospace or mechanical internships on
# the lists in that time (0 turns this off); they feed All engineering and Fall
# only. Found sites are saved in data/discovered_boards.json and shown as
# "found automatically" on the page.
[discover]
engineering_min = 3

# --- Past cycles, for the Predicted tab ------------------------------------
# Old copies of the Simplify list, pinned to a commit so they never change.
# Each is read once into data/history.json, which then grows with every scan.
# (SimplifyJobs renames the repo each year and restarts the file now and then;
# these two cover Nov 2022 to Mar 2026, and the live list covers the rest.)
[history]
urls = [
  "https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/4f8f23aced456c802b6e8d7bb06c8aa79dd661b4/.github/scripts/listings.json",
  "https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/ae7e10dc1e6c63b453a9835726333136ed4eb741/.github/scripts/listings.json",
]

# --- Federal jobs (DoD, Air Force, Navy, NASA) via USAJOBS --------------
# Free API key: https://developer.usajobs.gov/apirequest/
# Then add USAJOBS_API_KEY and USAJOBS_EMAIL as repo secrets (see README).
[usajobs]
keywords = ["aerospace engineering student", "engineering student trainee", "aerospace intern",
            "mechanical engineering student", "engineering technician student"]

# --- One employer, many names ---------------------------------------------
# Lists name divisions their own way ("Raytheon" or "Collins Aerospace" for a job
# on RTX's career site). Names on the right count as the employer on the left when
# checking whether a lead without a link is a job a career site already has.
# Matched as whole words; start a name with = to match the whole company name only.
[same_company]
