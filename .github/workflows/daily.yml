name: Daily job scan

on:
  schedule:
    # Every 5 hours: 00:15, 05:15, 10:15, 15:15 and 20:15 UTC (7:15 PM, 12:15 AM, 5:15 AM, 10:15 AM
    # and 3:15 PM Eastern in winter, an hour later in summer). A day isn't a multiple of 5 hours,
    # so the last gap each day is 4 hours. GitHub often starts scheduled runs a few minutes late.
    - cron: "15 */5 * * *"
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan for internships
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python run.py

      - name: Save results
        run: |
          git config user.name "job-scan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data README.md
          if git diff --staged --quiet; then
            echo "No changes today."
          else
            git commit -m "Job scan $(date -u +%Y-%m-%d)"
            git push
          fi
