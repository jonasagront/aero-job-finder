name: Daily job scan

on:
  schedule:
    # Every 5 hours: 00:15, 05:15, 10:15, 15:15 and 20:15 UTC (7:15 PM, 12:15 AM, 5:15 AM, 10:15 AM
    # and 3:15 PM Eastern in winter, an hour later in summer). A day isn't a multiple of 5 hours,
    # so the last gap each day is 4 hours. GitHub often starts scheduled runs a few minutes late.
    - cron: "15 */5 * * *"
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # A scan takes about 10-15 minutes; run.py skips its optional coverage audit past 22.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the scan's rules (age limit, pagination, merging)
        run: python -m unittest discover tests

      - name: Scan for internships
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          # Daily digest delivery (optional; nothing is sent unless [notify] enabled = true
          # in profile.toml AND one of these channels is set up; see README)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          DIGEST_WEBHOOK_URL: ${{ secrets.DIGEST_WEBHOOK_URL }}
        run: python run.py

      - name: Save results
        run: |
          git config user.name "job-scan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data README.md
          if git diff --staged --quiet; then
            echo "No changes today."
          else
            git commit -m "Job scan $(date -u +%Y-%m-%d)"
            git push
          fi
